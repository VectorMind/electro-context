<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700"><title>Four one-sided screw joints in section</title><rect width="1020" height="700" fill="#faf9f4"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183d48">Four ways to tighten from the belly</text><text x="25" y="64" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183d48">Section through one fastener   /   blue lid above, white belly below, driver approaches from below</text><g transform="translate(25 101)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183d48">A   Side-loaded hex nut</text><rect x="40" y="21" width="335" height="16" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="103" y="37" width="187" height="91" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="40" y="129" width="335" height="39" fill="#e4e0d5" stroke="#35555c" stroke-width="1.3"/><rect x="186" y="55" width="20" height="101" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="157" y="68" width="133" height="26" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="273" y="86" width="9" height="8" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><text x="305" y="86" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#183d48">? slide</text><rect x="162" y="68" width="68" height="26" fill="#98a6af" stroke="#35555c" stroke-width="1.3"/><rect x="170" y="146" width="52" height="23" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="189" y="62" width="14" height="85" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><rect x="175" y="147" width="42" height="15" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><path d="M189 66 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 72 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 78 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 84 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 90 l14 -4" stroke="white" stroke-width="1.2"/><path d="M196 198v-25m-5 7 5-7 5 7" fill="none" stroke="#276b7b" stroke-width="2.5"/><text x="216" y="191" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183d48">driver</text><text x="0" y="225" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">Slide the nut into the boss from inside the open lid.</text><text x="0" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">A retaining nib keeps it in place during servicing.</text></g><g transform="translate(530 101)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183d48">B   Nut behind a keeper plate</text><rect x="40" y="21" width="335" height="16" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="103" y="37" width="187" height="91" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="40" y="129" width="335" height="39" fill="#e4e0d5" stroke="#35555c" stroke-width="1.3"/><rect x="186" y="55" width="20" height="101" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="162" y="68" width="68" height="26" fill="#98a6af" stroke="#35555c" stroke-width="1.3"/><rect x="155" y="94" width="82" height="33" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="130" y="95" width="132" height="32" fill="#67a7ad" stroke="#35555c" stroke-width="1.3"/><rect x="185" y="95" width="22" height="32" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="170" y="146" width="52" height="23" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="189" y="62" width="14" height="85" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><rect x="175" y="147" width="42" height="15" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><path d="M189 66 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 72 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 78 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 84 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 90 l14 -4" stroke="white" stroke-width="1.2"/><path d="M196 198v-25m-5 7 5-7 5 7" fill="none" stroke="#276b7b" stroke-width="2.5"/><text x="216" y="191" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183d48">driver</text><text x="0" y="225" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">Drop the nut into an inward-facing hex pocket.</text><text x="0" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">Bond or weld a load-bearing keeper over the pocket.</text></g><g transform="translate(25 393)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183d48">C   Nut embedded during printing</text><rect x="40" y="21" width="335" height="16" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="103" y="37" width="187" height="91" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="40" y="129" width="335" height="39" fill="#e4e0d5" stroke="#35555c" stroke-width="1.3"/><rect x="186" y="55" width="20" height="101" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="162" y="68" width="68" height="26" fill="#98a6af" stroke="#35555c" stroke-width="1.3"/><text x="300" y="105" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183d48">solid</text><rect x="170" y="146" width="52" height="23" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="189" y="62" width="14" height="85" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><rect x="175" y="147" width="42" height="15" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><path d="M189 66 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 72 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 78 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 84 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 90 l14 -4" stroke="white" stroke-width="1.2"/><path d="M196 198v-25m-5 7 5-7 5 7" fill="none" stroke="#276b7b" stroke-width="2.5"/><text x="216" y="191" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183d48">driver</text><text x="0" y="225" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">Pause the lid print, seat the nut below the nozzle path,</text><text x="0" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">then resume to print the retaining shoulder.</text></g><g transform="translate(530 393)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183d48">D   Heat-set threaded insert</text><rect x="40" y="21" width="335" height="16" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="103" y="37" width="187" height="91" fill="#97d4db" stroke="#35555c" stroke-width="1.3"/><rect x="40" y="129" width="335" height="39" fill="#e4e0d5" stroke="#35555c" stroke-width="1.3"/><rect x="186" y="55" width="20" height="101" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="173" y="59" width="46" height="58" fill="#d9ae56" stroke="#35555c" stroke-width="1.3"/><path d="M174 68 l7 -5 M211 68 l7 -5" stroke="#85622b" stroke-width="2"/><path d="M174 79 l7 -5 M211 79 l7 -5" stroke="#85622b" stroke-width="2"/><path d="M174 90 l7 -5 M211 90 l7 -5" stroke="#85622b" stroke-width="2"/><path d="M174 101 l7 -5 M211 101 l7 -5" stroke="#85622b" stroke-width="2"/><rect x="170" y="146" width="52" height="23" fill="#faf9f4" stroke="#35555c" stroke-width="1.3"/><rect x="189" y="62" width="14" height="85" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><rect x="175" y="147" width="42" height="15" fill="#556c79" stroke="#35555c" stroke-width="1.3"/><path d="M189 66 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 72 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 78 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 84 l14 -4" stroke="white" stroke-width="1.2"/><path d="M189 90 l14 -4" stroke="white" stroke-width="1.2"/><path d="M196 198v-25m-5 7 5-7 5 7" fill="none" stroke="#276b7b" stroke-width="2.5"/><text x="216" y="191" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183d48">driver</text><text x="0" y="225" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">Heat-set a brass insert into a blind hole from inside.</text><text x="0" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#183d48">Uses a dedicated insert in place of the loose hex nut.</text></g></svg>